name: Node

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: use pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: pnpm i
        run: pnpm i
      - name: build
        run: pnpm build
